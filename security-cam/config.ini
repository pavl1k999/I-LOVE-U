; ===== Настройки Security Cam =====
; После изменения перезапустите ПК или снова запустите install.bat

[camera]
index = 0
width = 1280
height = 720
fps = 20

[recording]
segment_minutes = 10
retention_days = 7

[telegram]
; Токен бота от @BotFather и ваш chat_id (как получить — в README)
token =
chat_id =
; Короткое видео после включения ПК (сек), 0 — не отправлять
start_clip_seconds = 20
; Присылать фото каждые N минут, 0 — не присылать
snapshot_every_minutes = 0

[stream]
; Живая трансляция в браузере: http://<IP ПК>:8080
enabled = true
port = 8080
user = admin
; ОБЯЗАТЕЛЬНО задайте пароль, иначе трансляция не включится
password =
